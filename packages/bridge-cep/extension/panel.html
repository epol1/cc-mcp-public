<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ae-compose</title>
<style>
  html, body { margin: 0; background: #232323; color: #c8c8c8; font: 12px/1.5 "Segoe UI", system-ui, sans-serif; }
  #root { padding: 8px 10px; }
  h1 { font-size: 13px; margin: 0; color: #e8e8e8; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  h1 #comp { font-weight: 400; color: #9aa4b2; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .ok { color: #6fcf7f; } .bad { color: #ef6b6b; } .dim { color: #858585; }
  nav { display: flex; gap: 2px; margin: 8px 0; border-bottom: 1px solid #3a3a3a; }
  nav a { padding: 3px 8px; cursor: pointer; color: #9a9a9a; border-bottom: 2px solid transparent; }
  nav a.on { color: #e8e8e8; border-color: #4683c4; }
  button { background: #3a3a3a; color: #ddd; border: 1px solid #4a4a4a; border-radius: 3px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  button.comp { display: block; width: 100%; text-align: left; margin: 2px 0; } button.cur { border-color: #4683c4; }
  .rig { margin: 0 0 10px; } .rig-h { color: #e0e0e0; font-weight: 600; margin-bottom: 2px; }
  .grp { color: #9aa4b2; margin: 4px 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; align-items: center; gap: 8px; padding: 1px 0 1px 8px; }
  .row span { flex: 1; } .row input { width: 92px; background: #1b1b1b; color: #ddd; border: 1px solid #3c3c3c; border-radius: 2px; padding: 1px 4px; }
  .row input[type=color] { width: 48px; height: 18px; padding: 0; }
  .issue { padding: 4px 6px; margin: 3px 0; border-left: 3px solid #666; background: #2a2a2a; cursor: pointer; }
  .issue.warn { border-color: #e8a33d; } .issue .jump { color: #4683c4; }
  .recipe { margin: 6px 0; }
  textarea { width: 100%; box-sizing: border-box; height: 80px; background: #1b1b1b; color: #ddd; border: 1px solid #3c3c3c; resize: vertical; }
  #bridge { margin-top: 10px; font-size: 11px; } pre { white-space: pre-wrap; word-break: break-word; font: 10px/1.3 Consolas, monospace; color: #7a7a7a; margin: 4px 0 0; max-height: 80px; overflow: auto; }
</style>
</head>
<body>
<div id="root">
  <h1>ae-compose <span id="comp">…</span><button id="refresh" title="Refresh">↻</button></h1>
  <nav><a id="t-controls">Controls</a><a id="t-lint">Lint</a><a id="t-variants">Variants</a><a id="t-recipes">Recipes</a><a id="t-ask">Ask Claude</a></nav>
  <div id="controls"></div>
  <div id="lint"></div>
  <div id="variants"></div>
  <div id="recipes"></div>
  <div id="ask"><textarea id="ask-text" placeholder="Ask the Claude session for a change: “make the cards slower and warmer”, “fix the lint on beat 2”…"></textarea><button id="ask-send">Send to Claude</button><p class="dim">Queued for the session (it reads them with designer_inbox), with this comp, the current time and the selected layers.</p></div>
  <div id="dstatus" class="dim"></div>
  <div id="bridge"><div id="status">Starting…</div><pre id="log"></pre></div>
</div>
<script>window.AEC_ROLE = "panel";</script>
<script src="./loader.js"></script>
<script src="./designer.js"></script>
</body>
</html>
